# Dois usos:
#   1. Só o banco, pra rodar backend/frontend direto no host (recomendado no dia a dia):
#        docker compose up postgres -d
#        npm run dev:backend   # conecta em localhost:5433, ver backend/.env.example
#        npm run dev:frontend
#   2. Stack completa, simulando o deploy de produção (mesmas imagens do Railway):
#        docker compose up --build
#        backend:  http://localhost:3000/api/health
#        frontend: http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urna
      POSTGRES_PASSWORD: urna
      POSTGRES_DB: urna
    # Publicado em 5433 (não 5432) pra não colidir com um PostgreSQL já
    # instalado nativamente na máquina — se você não tiver um, pode trocar
    # para "5432:5432" e simplificar as URLs abaixo.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urna"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-troque-este-valor-antes-de-usar-de-verdade}
      FRONTEND_URL: http://localhost:8080
      DATABASE_URL: postgresql://urna:urna@postgres:5432/urna
      DATA_PATH: /app/data
      # Obrigatórias pra subir (Etapa 8.1) — sem uma chave/domínio real do Resend, o
      # cadastro continua funcionando, só o e-mail de confirmação não chega (erro fica só
      # no log do backend, ver docs/DEPLOY.md).
      RESEND_API_KEY: ${RESEND_API_KEY:-troque-por-uma-chave-de-teste}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@seudominio.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-UrnaLab}
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  backend-data:
